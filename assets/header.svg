<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Monem Benjeddou, backend engineer</title>
  <style>
    .name { font: 700 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; letter-spacing: .5px; }
    .sub  { font: 500 18px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; letter-spacing: 2px; }
    .type { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #e2e8f0; }
    .prompt { font: 600 26px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #5eead4; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#101935"/>
    </linearGradient>
    <linearGradient id="nameg" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#99f6e4"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle cx="980" cy="60" r="150" fill="#14b8a6" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="980;860;1040;980"/>
      <animate attributeName="cy" dur="14s" repeatCount="indefinite" values="60;150;110;60"/>
    </circle>
    <circle cx="760" cy="280" r="140" fill="#6366f1" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="760;920;700;760"/>
      <animate attributeName="cy" dur="18s" repeatCount="indefinite" values="280;220;300;280"/>
    </circle>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <text x="80" y="104" class="sub">SOUSSE, TUNISIA  ·  REMOTE</text>
    <text x="78" y="166" class="name" fill="url(#nameg)" style="fill:url(#nameg)">Monem Benjeddou</text>
    <text x="46" y="222" class="prompt">›</text>
    
  <clipPath id="c0"><rect x="80" y="192" height="40" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.075;0.205;0.235;1" values="0;363;363;0;0"/></rect></clipPath>
  <text x="80" y="222" clip-path="url(#c0)" class="type">Python backend engineer</text>
  <rect y="198" width="3" height="30" fill="#5eead4" x="80">
    <animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.075;0.205;0.235;1" values="80;443;443;80;80"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.075;0.205;0.235;1" values="1;1;1;0;0" calcMode="discrete"/>
  </rect>
  <clipPath id="c1"><rect x="80" y="192" height="40" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.250;0.325;0.455;0.485;1" values="0;0;503;503;0;0"/></rect></clipPath>
  <text x="80" y="222" clip-path="url(#c1)" class="type">RAG and LLM agents in production</text>
  <rect y="198" width="3" height="30" fill="#5eead4" x="80">
    <animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.250;0.325;0.455;0.485;1" values="80;80;583;583;80;80"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.250;0.325;0.455;0.485;1" values="0;1;1;1;0;0" calcMode="discrete"/>
  </rect>
  <clipPath id="c2"><rect x="80" y="192" height="40" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.500;0.575;0.705;0.735;1" values="0;0;456;456;0;0"/></rect></clipPath>
  <text x="80" y="222" clip-path="url(#c2)" class="type">Arabic NLP at 10,000 docs/day</text>
  <rect y="198" width="3" height="30" fill="#5eead4" x="80">
    <animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.500;0.575;0.705;0.735;1" values="80;80;536;536;80;80"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.500;0.575;0.705;0.735;1" values="0;1;1;1;0;0" calcMode="discrete"/>
  </rect>
  <clipPath id="c3"><rect x="80" y="192" height="40" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.750;0.825;0.955;0.985;1" values="0;0;519;519;0;0"/></rect></clipPath>
  <text x="80" y="222" clip-path="url(#c3)" class="type">FastAPI · Django · Celery · Azure</text>
  <rect y="198" width="3" height="30" fill="#5eead4" x="80">
    <animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.750;0.825;0.955;0.985;1" values="80;80;599;599;80;80"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.750;0.825;0.955;0.985;1" values="0;1;1;1;0;0" calcMode="discrete"/>
  </rect>
  </g>
</svg>
